[package]
name = "ecdict"
version = "1.2.0"
edition = "2021"
description = "simple ecdict 离线英汉词典（Windows GUI）"
license = "MIT"
authors = ["ecdict"]
autobins = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "links",
] }

[build-dependencies]
embed-resource = "2"

[[bin]]
name = "ecdict-gui"
path = "src/bin/ecdict-gui.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
